name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  RUNTIME: win-x64
  PUBLISH_DIR: publish
  PROJECT: RSValve.Desktop/RSValve.Desktop.csproj

jobs:
  build-windows:
    name: Build and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'Could not read Version from Directory.Build.props' }
          $version = $match.Matches.Groups[1].Value.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RUNTIME }} --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o ${{ env.PUBLISH_DIR }}

      - name: Rename to RS-Valve.exe
        shell: pwsh
        run: |
          $src = "${{ env.PUBLISH_DIR }}\RSValve.exe"
          $dst = "${{ env.PUBLISH_DIR }}\RS-Valve.exe"
          if (-not (Test-Path $src)) {
            Get-ChildItem "${{ env.PUBLISH_DIR }}" -Filter *.exe
            throw "RSValve.exe not found after publish"
          }
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Rename-Item $src $dst
          Write-Host "Created $dst"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "INNO_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Inno Setup: $iscc"

      - name: Compile installer
        shell: pwsh
        run: |
          & $env:INNO_ISCC "$PWD\installer\installer.iss" /DAppVersion="${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = "$PWD\publish\RS-Valve-Setup.exe"
          if (-not (Test-Path $setup)) {
            Get-ChildItem publish
            throw "RS-Valve-Setup.exe was not created"
          }
          Write-Host "Installer size: $((Get-Item $setup).Length) bytes"

      - name: Upload RS-Valve-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: RS-Valve-Setup-v${{ steps.version.outputs.version }}
          path: publish/RS-Valve-Setup.exe
          retention-days: 90

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: RS-Valve-win-x64-v${{ steps.version.outputs.version }}
          path: publish/
          retention-days: 14
