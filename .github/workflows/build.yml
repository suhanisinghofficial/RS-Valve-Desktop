# Builds RS-Valve for Windows (win-x64) and packages RS-Valve-Setup.exe with Inno Setup.

name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  RUNTIME: win-x64
  PUBLISH_DIR: publish
  PROJECT: RSValve.Desktop/RSValve.Desktop.csproj

jobs:
  build-windows:
    name: Build & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Path Directory.Build.props -Encoding UTF8
          $pg = $props.Project.PropertyGroup
          if ($pg -is [System.Array]) { $pg = $pg | Where-Object { $_.Version } | Select-Object -First 1 }
          $version = $pg.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version not found in Directory.Build.props" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish (self-contained, multi-file)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ env.RUNTIME }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o ${{ env.PUBLISH_DIR }}

      - name: Rename to RS-Valve.exe
        shell: pwsh
        run: |
          $src = Join-Path "${{ env.PUBLISH_DIR }}" "RSValve.exe"
          $dst = Join-Path "${{ env.PUBLISH_DIR }}" "RS-Valve.exe"
          if (-not (Test-Path $src)) {
            Write-Error "Publish did not produce RSValve.exe"
            Get-ChildItem "${{ env.PUBLISH_DIR }}" -Filter *.exe | Format-Table Name, Length
            exit 1
          }
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Rename-Item -Path $src -NewName "RS-Valve.exe"
          Write-Host "OK: $dst"

      - name: Install Inno Setup 6
        uses: aminya/gh-action-inno-setup@v0.9.0

      - name: Compile installer
        shell: pwsh
        run: |
          $iss = Join-Path $PWD "installer\installer.iss"
          if (-not (Test-Path $iss)) { throw "Missing $iss" }
          ISCC.exe $iss /DAppVersion="${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with exit code $LASTEXITCODE" }

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "publish\RS-Valve-Setup.exe"
          if (-not (Test-Path $setup)) {
            Get-ChildItem publish -Filter *.exe | Format-Table Name, Length
            throw "Installer not found at $setup"
          }
          Write-Host "Installer OK: $setup ($((Get-Item $setup).Length) bytes)"

      - name: Upload RS-Valve-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: RS-Valve-Setup-v${{ steps.version.outputs.version }}
          path: publish/RS-Valve-Setup.exe
          retention-days: 90
          if-no-files-found: error

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: RS-Valve-win-x64-v${{ steps.version.outputs.version }}
          path: publish/
          retention-days: 14
          if-no-files-found: error
