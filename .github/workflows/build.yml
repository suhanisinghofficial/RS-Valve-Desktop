name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_VERSION: '8.0.x'
  RUNTIME: win-x64
  PUBLISH_APP_DIR: publish/app
  PROJECT: RSValve.Desktop/RSValve.Desktop.csproj

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content Directory.Build.props | Where-Object { $_ -match '^\s*<Version>' } | Select-Object -First 1
          if (-not $line) { throw 'Version not found in Directory.Build.props' }
          $version = ($line -replace '.*<Version>([^<]+)</Version>.*', '$1').Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish app
        run: dotnet publish ${{ env.PROJECT }} -c Release -r ${{ env.RUNTIME }} --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -o ${{ env.PUBLISH_APP_DIR }}

      - name: Rename to RS-Valve.exe
        shell: pwsh
        run: |
          $dir = "${{ env.PUBLISH_APP_DIR }}"
          $src = Join-Path $dir "RSValve.exe"
          $dst = Join-Path $dir "RS-Valve.exe"
          if (-not (Test-Path $src)) {
            Write-Host "Files in $dir :"
            Get-ChildItem $dir -Filter *.exe | Format-Table Name, Length
            throw "RSValve.exe not found after publish"
          }
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Rename-Item -Path $src -NewName "RS-Valve.exe"
          Write-Host "OK: $dst"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ge 2) { throw "choco install failed with $LASTEXITCODE" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "Using $iscc"

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iss = Join-Path $env:GITHUB_WORKSPACE "installer\installer.iss"
          Write-Host "Compiling $iss"
          & "$env:INNO_ISCC" $iss /DAppVersion="${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exit code $LASTEXITCODE" }

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "publish\RS-Valve-Setup.exe"
          if (-not (Test-Path $setup)) {
            Write-Host "Contents of publish:"
            Get-ChildItem publish -Recurse | Select-Object FullName, Length
            throw "RS-Valve-Setup.exe not found"
          }
          Write-Host "Installer OK: $((Get-Item $setup).Length) bytes"

      - name: Upload RS-Valve-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: RS-Valve-Setup-v${{ steps.version.outputs.version }}
          path: publish/RS-Valve-Setup.exe
          retention-days: 90

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: RS-Valve-app-v${{ steps.version.outputs.version }}
          path: publish/app/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RS VALVE v${{ steps.version.outputs.version }}
          files: publish/RS-Valve-Setup.exe
          generate_release_notes: true
          make_latest: true
          overwrite: true
